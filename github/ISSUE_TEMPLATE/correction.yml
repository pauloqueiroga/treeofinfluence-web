name: Correction
description: A typo, a broken link, a wrong fact, or 2 pages that disagree.
title: "[Correction] "
labels: ["correction"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page with the mistake.
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the text if you can.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: Optional. How it should read instead.
